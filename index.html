  <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-BTI : 당신은 어떤 사람입니까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f3f1;
    --grid:rgba(22,38,74,0.06);
    --green:#1c8a4d;
    --green-dark:#146538;
    --yellow:#f5b935;
    --navy:#16264a;
    --navy-dark:#0d1730;
    --text-dim:#707888;
    --card:#ffffff;
    --card-border:#e3e6ea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 34px);
    color:var(--navy);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .stage{ width:100%; max-width:420px; }
  .display{ font-family:'Black Han Sans', sans-serif; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(28,138,77,0.1);
    color:var(--green);
    font-weight:700; font-size:13px; letter-spacing:1px;
    padding:8px 16px; border-radius:30px; margin-bottom:22px;
  }

  .btn3d{
    display:block; width:100%; text-align:center; text-decoration:none;
    font-family:'Black Han Sans', sans-serif; font-size:19px; letter-spacing:0.5px;
    color:#fff; padding:18px; border-radius:16px; border:none; cursor:pointer;
    background:var(--green); box-shadow:0 5px 0 var(--green-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn3d:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--green-dark); }
  .btn3d.navy{ background:var(--navy); box-shadow:0 5px 0 var(--navy-dark); }

  /* 인트로 */
  #screen-intro{ text-align:center; padding-top:8px; }
  .intro-title{ font-size:34px; line-height:1.3; margin-bottom:14px; }
  .intro-sub{ color:var(--text-dim); font-size:15px; line-height:1.6; margin-bottom:34px; }
  .bars-deco{ display:flex; justify-content:center; align-items:flex-end; gap:14px; margin-bottom:40px; }
  .bars-deco div{ width:34px; border-radius:10px; }
  .bars-deco .b1{ height:70px; background:var(--green); }
  .bars-deco .b2{ height:110px; background:var(--yellow); }

  /* 퀴즈 */
  #screen-quiz{ padding-top:6px; }
  .track-row{ display:flex; gap:6px; margin-bottom:22px; }
  .track-seg{ flex:1; height:7px; border-radius:6px; background:#dfe2e6; overflow:hidden; }
  .track-seg.filled{ background:var(--green); }
  .track-seg.filled.final{ background:var(--yellow); }

  .q-badge{
    display:inline-block; font-family:'Black Han Sans',sans-serif; font-size:13px;
    color:#fff; background:var(--green); padding:6px 16px; border-radius:20px; margin-bottom:18px;
  }
  .q-badge.final{ background:var(--yellow); color:var(--navy-dark); }

  .q-text{ font-size:22px; font-weight:700; line-height:1.5; margin-bottom:30px; }

  .options{ display:flex; flex-direction:column; gap:14px; }
  .opt{
    background:var(--card); border:2px solid var(--green);
    border-radius:16px; padding:20px 20px;
    cursor:pointer; text-align:center; color:var(--navy); font-size:16px; font-weight:700;
    transition:transform .1s ease, background .15s ease;
    line-height:1.5;
  }
  .opt.final-mode{ border-color:var(--yellow); }
  .opt:hover{ background:#f7f8f6; }
  .opt:active{ transform:scale(0.98); }

  /* 명언/CTA */
  #screen-quote{ text-align:center; }
  .dots{ display:flex; justify-content:center; gap:10px; margin-bottom:26px; }
  .dots span{ width:11px; height:11px; border-radius:50%; }
  .dots .d1{ background:var(--green); }
  .dots .d2{ background:var(--yellow); }
  .quote-text{ font-size:28px; line-height:1.5; margin-bottom:10px; }
  .quote-src{ color:var(--text-dim); font-size:12.5px; margin-bottom:30px; }
  .quote-rule{ width:52px; height:4px; background:var(--green); border-radius:4px; margin:0 auto 40px; }

  footer{ text-align:center; margin-top:20px; font-size:11px; color:var(--text-dim); }
</style>
</head>
<body>

<div class="stage">

  <!-- 인트로 -->
  <div class="screen active" id="screen-intro">
    <div style="text-align:center;"><span class="eyebrow">▶ CHOOSE YOUR PATH ◀</span></div>
    <h1 class="display intro-title" style="text-align:center;">당신은 어떤<br>사람입니까?</h1>
    <p class="intro-sub" style="text-align:center;">두 개의 질문으로<br>알아보는 나의 유형</p>
    <div class="bars-deco"><div class="b1"></div><div class="b2"></div></div>
    <button class="btn3d" onclick="startQuiz()">게임 시작 ▶</button>
  </div>

  <!-- 퀴즈 -->
  <div class="screen" id="screen-quiz">
    <div class="track-row" id="track-row"></div>
    <span class="q-badge" id="q-badge">Q1</span>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- 명언 + CTA -->
  <div class="screen" id="screen-quote">
    <div class="dots"><span class="d1"></span><span class="d2"></span></div>
    <h2 class="display quote-text">시련은 있어도<br>실패는 없다.</h2>
    <div class="quote-src">— 현대그룹 창업주, 정주영</div>
    <div class="quote-rule"></div>
    <a class="btn3d navy" href="https://recruit.hdec.co.kr/#/" target="_blank" rel="noopener">게임종료 →</a>
  </div>

  <footer>H-BTI · 현대건설</footer>
</div>

<script>
const questions = [
  {
    q: "큰 실패를 경험한 당신! 다시 도전하시겠습니까?",
    options: [
      "도전에는 수업료가 필요한 법! 재도전한다.",
      "이전에 성공했던 다른 기회를 찾아 도전한다.",
    ]
  },
  {
    q: "모두가 만류하는 길, 당신은 도전하시겠습니까?",
    options: [
      "길이 없으면 길을 찾고 그래도 없으면 길을 닦는다.",
      "만류하는데 이유가 있는 법! 다른 방안을 찾는다.",
    ]
  },
];

let current = 0;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz(){
  current = 0;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderTrack(){
  const track = document.getElementById('track-row');
  track.innerHTML = '';
  for(let i=0;i<questions.length;i++){
    const seg = document.createElement('div');
    seg.className = 'track-seg';
    if(i < current+1){
      seg.classList.add('filled');
      if(i === questions.length-1) seg.classList.add('final');
    }
    track.appendChild(seg);
  }
}

function renderQuestion(){
  const item = questions[current];
  const isFinal = current === questions.length - 1;
  renderTrack();

  const badge = document.getElementById('q-badge');
  badge.textContent = isFinal ? `Q${current+1} · FINAL` : `Q${current+1}`;
  badge.classList.toggle('final', isFinal);

  document.getElementById('q-text').textContent = item.q;

  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  item.options.forEach((text)=>{
    const btn = document.createElement('button');
    btn.className = 'opt' + (isFinal ? ' final-mode' : '');
    btn.textContent = text;
    btn.onclick = ()=> answer();
    wrap.appendChild(btn);
  });
}

// 답변 내용과 무관하게 항상 같은 다음 단계로 진행
function answer(){
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    showScreen('screen-quote');
  }
}
</script>

</body>
</html>
