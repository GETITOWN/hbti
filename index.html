<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-BTI : 당신 안의 현대인을 찾아드립니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#12141a;
    --bg-panel:#1c2029;
    --bg-panel-hover:#252a36;
    --line:#2f3542;
    --safety:#ffc53d;
    --steel:#4c7cf0;
    --cone:#ff6b4a;
    --rebar:#6b7280;
    --text:#f5f6fa;
    --text-dim:#9aa1b1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      linear-gradient(var(--bg-base),var(--bg-base)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 32px);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .stage{
    width:100%;
    max-width:460px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(135deg, var(--safety) 0 12px, #1a1a1a 12px 24px);
  }
  .stencil{
    font-family:'Stardos Stencil', cursive;
    letter-spacing:1px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- INTRO ---------- */
  .intro{ padding:48px 32px 36px; text-align:center; }
  .badge-icon{
    width:88px; height:88px; margin:0 auto 24px;
    background:var(--bg-base);
    border:2px solid var(--safety);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-3deg);
  }
  .badge-icon svg{ width:48px; height:48px; }
  .intro h1{ font-size:30px; margin-bottom:10px; color:var(--safety); }
  .intro p.lead{ color:var(--text-dim); font-size:14px; margin-bottom:28px; line-height:1.6; }
  .stat-row{
    display:flex; justify-content:space-around;
    background:var(--bg-base); border:1px solid var(--line); border-radius:4px;
    padding:18px 8px; margin-bottom:28px;
  }
  .stat-row div{ text-align:center; }
  .stat-row .num{ font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--steel); font-weight:600; }
  .stat-row .lbl{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  button.primary{
    width:100%;
    background:var(--safety);
    color:#141414;
    border:none;
    padding:16px;
    font-size:16px;
    font-weight:800;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:0.5px;
    transition:transform .15s ease, filter .15s ease;
  }
  button.primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  button.primary:active{ transform:translateY(0px) scale(0.99); }
  .ghost-link{
    display:block; margin-top:16px; color:var(--text-dim); font-size:13px;
    background:none; border:none; cursor:pointer; text-decoration:underline;
  }

  /* ---------- QUIZ ---------- */
  .quiz{ padding:28px 26px 30px; display:none; }
  .quiz.active{ display:block; }
  .progress-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .progress-msg{ font-size:13px; color:var(--safety); font-weight:600; }
  .progress-count{ font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
  .tape-track{
    height:10px; background:var(--bg-base); border:1px solid var(--line); border-radius:2px;
    overflow:hidden; margin-bottom:28px; position:relative;
  }
  .tape-fill{
    height:100%;
    background:repeating-linear-gradient(135deg, var(--safety) 0 8px, #141414 8px 16px);
    width:0%;
    transition:width .35s ease;
  }
  .q-icon{ font-size:12px; color:var(--rebar); font-family:'IBM Plex Mono',monospace; letter-spacing:2px; margin-bottom:8px; }
  .q-text{ font-size:19px; font-weight:700; margin-bottom:22px; line-height:1.5; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    background:var(--bg-base);
    border:1px solid var(--line);
    border-radius:4px;
    padding:15px 16px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    font-size:14.5px;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .opt:hover{ background:var(--bg-panel-hover); border-color:var(--steel); }
  .opt:active{ transform:scale(0.98); }
  .opt .tag{
    flex:0 0 auto; width:26px; height:26px; border-radius:4px;
    background:var(--steel); color:#fff; font-weight:800; font-size:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- RESULT ---------- */
  .result{ padding:0; display:none; }
  .result.active{ display:block; }
  .result-top{
    padding:34px 28px 24px; text-align:center;
    border-bottom:1px dashed var(--line);
  }
  .type-code{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--bg-base); background:var(--safety); padding:3px 10px; border-radius:20px;
    margin-bottom:14px; font-weight:700; letter-spacing:1px;
  }
  .result-title{ font-size:28px; color:var(--safety); margin-bottom:8px; }
  .result-sub{ font-size:14px; color:var(--text-dim); }
  .result-body{ padding:26px 28px; }
  .result-desc{ font-size:14.5px; line-height:1.75; color:var(--text); margin-bottom:18px; }
  .history-box{
    background:var(--bg-base); border-left:3px solid var(--steel); border-radius:4px;
    padding:14px 16px; font-size:13px; line-height:1.7; color:#c9cedb; margin-bottom:20px;
  }
  .job-box{
    display:flex; align-items:center; gap:10px; margin-bottom:24px;
    font-size:13.5px;
  }
  .job-box .job-label{ color:var(--text-dim); }
  .job-box .job-value{ color:var(--cone); font-weight:700; }
  .stats{ display:flex; flex-direction:column; gap:14px; margin-bottom:28px; }
  .stat-item .stat-label{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; color:var(--text-dim); }
  .stat-item .stat-label span:last-child{ font-family:'IBM Plex Mono',monospace; color:var(--text); }
  .bar-track{ height:8px; background:var(--bg-base); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--steel), var(--safety)); width:0%; transition:width 1s ease; border-radius:10px; }
  .result-actions{ display:flex; gap:10px; }
  .result-actions button{
    flex:1; padding:14px; border-radius:4px; border:1px solid var(--line);
    background:var(--bg-base); color:var(--text); font-weight:600; cursor:pointer; font-size:13.5px;
  }
  .result-actions button.primary{ background:var(--safety); color:#141414; border:none; }

  footer{ text-align:center; margin-top:18px; font-size:11px; color:var(--rebar); }
</style>
</head>
<body>

<div class="stage">

  <!-- INTRO -->
  <div class="card" id="screen-intro">
    <div class="intro">
      <div class="badge-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffc53d" stroke-width="1.8"><path d="M12 3L2 21h20L12 3z"/></svg>
      </div>
      <h1 class="stencil">H-BTI</h1>
      <p class="lead">8개의 질문으로 알아보는<br>당신 안의 현대인(現代人)</p>
      <div class="stat-row">
        <div><div class="num">2분</div><div class="lbl">소요시간</div></div>
        <div><div class="num">8개</div><div class="lbl">질문 수</div></div>
        <div><div class="num">8가지</div><div class="lbl">결과 유형</div></div>
      </div>
      <button class="primary" onclick="startQuiz()">테스트 시작하기</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="card quiz" id="screen-quiz">
    <div class="progress-head">
      <span class="progress-msg" id="progress-msg">시작이 반이에요!</span>
      <span class="progress-count mono" id="progress-count">1 / 8</span>
    </div>
    <div class="tape-track"><div class="tape-fill" id="tape-fill"></div></div>
    <div class="q-icon" id="q-icon">Q1</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- RESULT -->
  <div class="card result" id="screen-result">
    <div class="result-top">
      <div class="type-code" id="r-code">TYPE</div>
      <div class="result-title stencil" id="r-title"></div>
      <div class="result-sub" id="r-sub"></div>
    </div>
    <div class="result-body">
      <p class="result-desc" id="r-desc"></p>
      <div class="history-box" id="r-history"></div>
      <div class="job-box"><span class="job-label">매칭 직무</span><span class="job-value" id="r-job"></span></div>
      <div class="stats" id="r-stats"></div>
      <div class="result-actions">
        <button onclick="restartQuiz()">다시 하기</button>
        <button class="primary" onclick="shareResult()">결과 공유하기</button>
      </div>
    </div>
  </div>

  <footer>H-BTI · 현대건설 인재상 기반 자체 제작 테스트</footer>
</div>

<script>
/* ===================== 데이터 ===================== */
// primary: A(도전/Value Creator) B(협업/Synergy Builder) C(글로벌/Global Developer) D(신뢰/Heritage Keeper)
// secondary: F(현장형) P(기획형)

const questions = [
  {
    q: "월요일 아침, 팀장이 급하게 새 업무를 던졌다. 나는?",
    options: [
      { text: "오, 재밌겠는데요? 바로 자료 찾기 시작", primary:"A", secondary:"F" },
      { text: "다른 분들 스케줄부터 확인해볼게요", primary:"B", secondary:"P" },
      { text: "해외 사례부터 찾아볼까요?", primary:"C", secondary:"F" },
      { text: "일정표부터 다시 정리하고 시작할게요", primary:"D", secondary:"P" },
    ]
  },
  {
    q: "갑자기 현장(혹은 작업 공간)에 문제가 생겼다는 연락이 왔다.",

      { text: "바로 뛰어가서 직접 확인", primary:"A", secondary:"P" },
      { text: "관련된 사람들 다 불러서 같이 해결", primary:"B", secondary:"F" },
      { text: "해외 지사/파트너한테도 상황 공유", primary:"C", secondary:"P" },
      { text: "매뉴얼·체크리스트부터 다시 확인", primary:"D", secondary:"F" },
    ]
  },
  {
    q: "점심시간, 나의 스타일은?",
    options: [
      { text: "안 가본 새 식당 도전", primary:"A", secondary:"F" },
      { text: "동료들이랑 다 같이 우르르", primary:"B", secondary:"P" },
      { text: "요즘 유행하는 이국적인 음식", primary:"C", secondary:"F" },
      { text: "늘 가던 그 집, 그 메뉴", primary:"D", secondary:"P" },
    ]
  },
  {
    q: "예상치 못한 변수로 계획이 틀어졌다. 내 반응은?",
    options: [
      { text: "그럼 아예 새로운 방법으로 가보죠", primary:"A", secondary:"P" },
      { text: "일단 다 모여서 같이 정리해봐요", primary:"B", secondary:"F" },
      { text: "다른 나라·부서는 어땠는지 찾아볼게요", primary:"C", secondary:"P" },
      { text: "원칙대로 하나씩 순서대로 갑시다", primary:"D", secondary:"F" },
    ]
  },
  {
    q: "낯선 도시로 출장을 가야 한다면?",
    options: [
      { text: "어디든 상관없어요, 일단 갑니다", primary:"A", secondary:"F" },
      { text: "같이 갈 사람 있는지 먼저 확인", primary:"B", secondary:"P" },
      { text: "완전 좋아요, 해외였으면 더 좋고요", primary:"C", secondary:"F" },
      { text: "숙소, 동선부터 꼼꼼히 정리하고요", primary:"D", secondary:"P" },
    ]
  },
  {
    q: "팀 프로젝트에서 예산이나 리소스가 빠듯하다면?",
    options: [
      { text: "그냥 되는 선에서 밀어붙여 보죠", primary:"A", secondary:"P" },
      { text: "다른 팀에 협조 요청부터 해볼게요", primary:"B", secondary:"F" },
      { text: "해외 벤치마킹 사례로 설득해볼게요", primary:"C", secondary:"P" },
      { text: "리스크부터 하나씩 점검해봅시다", primary:"D", secondary:"F" },
    ]
  },
  {
    q: "주말, 갑자기 급한 연락이 왔다.",
    options: [
      { text: "일단 되는 대로 처리부터", primary:"A", secondary:"F" },
      { text: "관련된 사람들이랑 단톡방부터", primary:"B", secondary:"P" },
      { text: "해외 파트너 시차도 고려해서", primary:"C", secondary:"F" },
      { text: "긴급도부터 원칙대로 판단", primary:"D", secondary:"P" },
    ]
  },
  {
    q: "내가 생각하는 '일 잘한다'의 기준은?",
    options: [
      { text: "남들이 안 하는 걸 해내는 것", primary:"A", secondary:"P" },
      { text: "다 같이 좋은 결과를 만드는 것", primary:"B", secondary:"F" },
      { text: "어디서든 통하는 실력을 갖추는 것", primary:"C", secondary:"P" },
      { text: "기본을 확실하게 지키는 것", primary:"D", secondary:"F" },
    ]
  },
];

const results = {
  AF: {
    code:"AF", title:"불도저 개척자", sub:"아무도 안 가본 길, 일단 부딪혀서 뚫는 타입",

  },

    history:"💡 원전 해체, SMR, 수소생산기지처럼 '지금까지 없던 사업'에 먼저 손대는 방식과 닮아있어요.",

    stats:[["창의력",92],["안정 지수",30],["희귀도",15]]
  },
  BF: {
    code:"BF", title:"현장의 조율사", sub:"여러 사람 손발을 맞춰 현장을 굴리는 타입",

    history:"💡 대형 프로젝트 하나엔 수백 개 협력업체가 얽혀 있어요. 결국 다 사람과 사람의 합이거든요.",

    stats:[["협업력",96],["독립성",25],["희귀도",10]]
  },
  BP: {
    code:"BP", title:"판을 짜는 연결자", sub:"사람과 자원을 이어 시너지를 만드는 타입",

    history:"💡 다양한 이해관계자와의 협력에서 시너지를 만드는 게 바로 이 유형의 핵심 역량이에요.",

  },

    desc:"화려하진 않아도, 이 사람이 있으면 다들 안심합니다. 남들이 안 보는 곳까지 꼼꼼히 챙기는, 조용하지만 단단한 사람.",
    history:"💡 현대건설 로고의 삼각형, 사실 '안전'을 상징해요. 눈에 안 띄어도 제일 중요한 걸 지키는 유형입니다.",
    job:"안전관리 · 품질관리",
    stats:[["신뢰도",98],["즉흥성",15],["희귀도",11]]
  },
  DP: {
    code:"DP", title:"기본을 세우는 사람", sub:"흔들리지 않는 원칙으로 뼈대를 세우는 타입",
    desc:"튀지 않아도 이 사람이 짜놓은 기준 위에서 모두가 안전하게 움직입니다. 화려한 성과보다 오래가는 구조를 만드는 데 강합니다.",
    history:"💡 70년 넘게 큰 흔들림 없이 이어온 것도, 결국 이런 유형들이 기본을 지켜왔기 때문 아닐까요.",
    job:"경영기획 · 재무 · 리스크 관리",
    stats:[["안정감",97],["즉흥성",13],["희귀도",13]]
  },
};

const progressMsgs = ["시작이 반이에요!","좋은 속도예요!","좋은 속도예요!","절반 지났어요!","절반 지났어요!","끝이 보여요! 조금만 더!","거의 다 왔어요!","마지막 질문이에요!"];

/* ===================== 로직 ===================== */
let current = 0;
let scores = { A:0,B:0,C:0,D:0,F:0,P:0 };

function startQuiz(){
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-quiz').classList.add('active');
  current = 0;
  scores = { A:0,B:0,C:0,D:0,F:0,P:0 };
  renderQuestion();
}

function renderQuestion(){
  const item = questions[current];
  document.getElementById('progress-msg').textContent = progressMsgs[current];
  document.getElementById('progress-count').textContent = `${current+1} / 8`;
  document.getElementById('tape-fill').style.width = `${((current+1)/8)*100}%`;
  document.getElementById('q-icon').textContent = `Q${current+1}`;
  document.getElementById('q-text').textContent = item.q;

  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  item.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="tag">${letters[idx]}</span><span>${opt.text}</span>`;
    btn.onclick = ()=> answer(opt);
    wrap.appendChild(btn);
  });
}

function answer(opt){
  scores[opt.primary]++;
  scores[opt.secondary]++;
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-quiz').style.display = 'none';

  const primaryLetters = ['A','B','C','D'];
  const secondaryLetters = ['F','P'];
  const topPrimary = primaryLetters.reduce((a,b)=> scores[b] > scores[a] ? b : a);
  const topSecondary = secondaryLetters.reduce((a,b)=> scores[b] > scores[a] ? b : a);
  const key = topPrimary + topSecondary;
  const r = results[key];

  document.getElementById('r-code').textContent = `TYPE : ${r.code}`;
  document.getElementById('r-title').textContent = r.title;
  document.getElementById('r-sub').textContent = r.sub;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-history').textContent = r.history;
  document.getElementById('r-job').textContent = r.job;

  const statsWrap = document.getElementById('r-stats');
  statsWrap.innerHTML = '';
  r.stats.forEach(([label,val])=>{
    const item = document.createElement('div');
    item.className = 'stat-item';
    item.innerHTML = `
      <div class="stat-label"><span>${label}</span><span>${val}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
    `;
    statsWrap.appendChild(item);
    setTimeout(()=>{ item.querySelector('.bar-fill').style.width = val+'%'; }, 100);
  });

  document.getElementById('screen-result').classList.add('active');
}

function restartQuiz(){
  document.getElementById('screen-result').classList.remove('active');
  document.getElementById('screen-quiz').style.display = 'block';
  document.getElementById('screen-intro').style.display = 'block';
  document.getElementById('screen-quiz').classList.remove('active');
}

function shareResult(){
  const title = document.getElementById('r-title').textContent;
  const text = `나의 H-BTI는 [${title}]! 당신의 결과는?`;
  if(navigator.share){
    navigator.share({ title:'H-BTI', text, url: location.href }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(`${text}\n${location.href}`);
    alert('결과 링크가 복사되었어요!');
  }
}
</script>
